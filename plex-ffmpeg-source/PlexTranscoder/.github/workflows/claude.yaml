name: Claude

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  # Auto-review: one per PR branch; comment-triggered: one per comment.
  group: >-
    ${{
      github.event_name == 'pull_request'
        && format('claude-pr-review-{0}', github.event.pull_request.head.ref)
        || format('claude-comment-{0}', github.event.comment.id)
    }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: write
  id-token: write
  issues: write
  packages: read
  pull-requests: write

jobs:
  auto-review:
    name: Review pull request
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    if: >-
      github.event_name == 'pull_request'
      && !github.event.pull_request.draft
      && !startsWith(github.event.pull_request.head.ref, 'changeset-release/')
      && !startsWith(github.event.pull_request.head.ref, 'renovate/')
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - uses: plexinc/actions/dist/claude-review@1baca65c993dca102eebf9c6918e876396da40a8  # v1.2.1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          gh_token: ${{ secrets.GH_TOKEN_REPO_ACCESS }}

  deps-review:
    name: Review Renovate pull request
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    if: >-
      github.event_name == 'pull_request'
      && !github.event.pull_request.draft
      && startsWith(github.event.pull_request.head.ref, 'renovate/')
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - uses: plexinc/actions/dist/claude-deps-review@1048e2285f7a59770c69fec1ad8b9103d0b46c23  # v1.0.2
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          gh_token: ${{ secrets.GH_TOKEN_REPO_ACCESS }}

  comment-review:
    name: Respond to @claude mentions
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    if: >-
      (github.event_name == 'issue_comment'
      || github.event_name == 'pull_request_review_comment')
      && contains(github.event.comment.body, '@claude') && !contains(github.event.comment.body, '@claude ignore')
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Checkout pull request branch
        run: gh pr checkout ${{ github.event.pull_request.number || github.event.issue.number }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # If hooks are used for linting or formatting changes, ensure those tools
      # are set up first, like with `pnpm install`.

      - uses: plexinc/actions/dist/claude-mention@de376519b946cd419df553805039f14a53c022aa  # v1.2.3
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          gh_token: ${{ secrets.GH_TOKEN_REPO_ACCESS }}